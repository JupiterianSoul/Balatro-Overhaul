[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
pattern = 'table.sort(G.P_CENTER_POOLS[self.set], function(a, b) return a.order < b.order end)'
position = 'before'
payload = '''
local overhaul_stake_broken = false
for _, stake in ipairs(G.P_CENTER_POOLS[self.set]) do
    for _, key in pairs(stake.applied_stakes or {}) do
        local below = G.P_STAKES[key]
        if below and below ~= stake and below.order >= stake.order then overhaul_stake_broken = true end
    end
end
if overhaul_stake_broken then
    for stake, order in pairs(overhaul_stake_orders or {}) do stake.order = order end
end
'''
match_indent = true
