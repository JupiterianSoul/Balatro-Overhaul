pattern = "if ante <= 8 then return amounts[to_number(ante)] end"
position = 'at'
payload = """if ante <= 8 then
    local n = to_number(ante)
    local lo = math.floor(n)
    if lo == n then return amounts[n] end
    return amounts[lo] + (amounts[lo + 1] - amounts[lo]) * (n - lo)
end"""
match_indent = true

