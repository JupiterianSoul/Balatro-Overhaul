[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.regex]
id = "auto.smods_core.001"
target = '=[SMODS _ "src/core.lua"]'
pattern = '''^(?<pre>)[\t ]*local catimg = NFS\.getInfo\(SMODS\.path\.\."assets/cat\.png"\) and love\.graphics\.newImage\(love\.filesystem\.newFileData\(NFS\.read\(SMODS\.path\.\."assets/cat\.png"\)\)\)\n(?<post>)'''
position = "at"
payload = '''
${pre}LOADING_SCREEN = LOADING_SCREEN or require("functions/loading_screen")
${post}'''
times = 1

[[patches]]
[patches.regex]
id = "auto.smods_core.003"
target = '=[SMODS _ "src/core.lua"]'
pattern = '''^(?<pre>)[\t ]*love\.graphics\.dis\n[\t ]*\}\n[\t ]*local realw, realh = love\.graphics\.getDimensions\(\)\n[\t ]*\n[\t ]*love\.graphics\.setCanvas\(\)\n[\t ]*love\.graphics\.push\(\)\n[\t ]*love\.graphics\.setShader\(\)\n[\t ]*love\.graphics\.clear\(0, 0, 0, 1\)\n[\t ]*love\.graphics\.setColor\(0\.6, 0\.8, 0\.9, 1\)\n[\t ]*if progress > 0 then love\.graphics\.rectangle\('fill', realw / 2 - 150, realh / 2 - 15, progress \* 300, 30, 5\) end\n[\t ]*love\.graphics\.setColor\(1, 1, 1, 1\)\n[\t ]*love\.graphics\.setLineWidth\(3\)\n[\t ]*love\.graphics\.rectangle\('line', realw / 2 - 150, realh / 2 - 15, 300, 30, 5\)\n[\t ]*if catimg then love\.graphics\.draw\(catimg, realw/2 - 264, realh/2 - 27, 0, 1, 1\); love\.graphics\.rectangle\('line', realw/2 - 264, realh/2 - 27, 96, 96, 5\) end\n[\t ]*love\.graphics\.print\("LOADING: " \.\. _next, realw / 2 - 150, realh / 2 \+ 40\)\n[\t ]*love\.graphics\.pop\(\)\n[\t ]*love\.graphics\.present\(\)\n(?<post>)'''
position = "at"
payload = '''
${pre}    }
    LOADING_SCREEN.draw(_next)
${post}'''
times = 1
